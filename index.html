<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Моя садовая сказка</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <main class="app">

        <header class="header">
            <h1>Моя садовая сказка</h1>
        </header>

        <section class="controls">

            <div class="search">
                <input
                    type="search"
                    id="search"
                    placeholder="Найти цветок..."
                >
            </div>

            <div class="filters">
                <button
                    class="filter-btn active"
                    data-category="all"
                    type="button"
                >
                    Все
                </button>

                <button
                    class="filter-btn"
                    data-category="red"
                    type="button"
                >
                    Красные
                </button>

                <button
                    class="filter-btn"
                    data-category="gold"
                    type="button"
                >
                    Золотые
                </button>

                <button
                    class="filter-btn"
                    data-category="purple"
                    type="button"
                >
                    Фиолетовые
                </button>
            </div>

            <div class="extra-filters">

                <label for="player-filter">Игрок:</label>
                <select id="player-filter">
                    <option value="">Все игроки</option>
                </select>

                <label for="min-points">Минимум баллов до улучшения:</label>
                <input
                    type="number"
                    id="min-points"
                    min="0"
                    step="1"
                    placeholder="Например, 20"
                >

            </div>

        </section>

        <section class="flowers-section">
            <div id="flowers-container" class="flowers-container"></div>
        </section>

        
        <dialog id="flower-modal" class="flower-modal">
            <div class="modal-header">
                <h2 id="modal-title"></h2>

                <button
                    type="button"
                    id="close-modal"
                    class="close-modal"
                    aria-label="Закрыть окно"
                >
                    &times;
                </button>
            </div>

            <h3>Игроки:</h3>

            <ul id="modal-players" class="modal-players"></ul>
        </dialog>

    </main>

    <script src="js/script.js"></script>

</body>
</html>
